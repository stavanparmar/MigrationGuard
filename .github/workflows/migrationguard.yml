name: MigrationGuard

on:
  pull_request:
    paths:
      - "migrations/*.sql"
      - "migrations/**/*.sql"

permissions:
  contents: read
  pull-requests: write

jobs:
  review-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install MigrationGuard
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Review changed migrations
        id: review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          report="migrationguard-report.md"
          : > "$report"
          result=0
          while IFS= read -r -d '' file; do
            temporary_report="$(mktemp)"
            if migrationguard check "$file" --report-file "$temporary_report"; then
              file_result=0
            else
              file_result=$?
            fi
            cat "$temporary_report" >> "$report"
            rm -- "$temporary_report"
            if [ "$file_result" -gt "$result" ]; then
              result="$file_result"
            fi
          done < <(git diff --name-only --diff-filter=ACMRT -z \
            "$BASE_SHA...$HEAD_SHA" -- 'migrations/*.sql' 'migrations/**/*.sql')
          if [ ! -s "$report" ]; then
            echo "No changed SQL migrations were found." > "$report"
          fi
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
      - name: Comment on pull request
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- migrationguard-report -->";
            const body = `${marker}\n${fs.readFileSync("migrationguard-report.md", "utf8")}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(
              comment => comment.user.type === "Bot" && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail on BLOCK or invalid SQL
        if: steps.review.outputs.exit_code != '0'
        env:
          REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: exit "$REVIEW_EXIT_CODE"
