[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrationguard"
version = "0.1.0"
description = "Deterministic PostgreSQL migration risk checks with optional LLM explanations"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
migrationguard = "migrationguard.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["migrationguard*"]
